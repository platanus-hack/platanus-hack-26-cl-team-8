packages:
  - "apps/*"
  - "packages/*"
  - "libs/*"

# Dependencias nativas que necesitan correr sus scripts de build.
# pnpm 10 lee `onlyBuiltDependencies`; pnpm 11 lee `allowBuilds`.
onlyBuiltDependencies:
  - canvas
  - gl
  - esbuild
  - sharp
  - workerd

allowBuilds:
  canvas: true
  gl: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-utils@0.56.0'
  - miniflare@5.20261119.0-beta
  - wrangler@4.166.0
