# Prompt Arena — stack completo en un solo servidor.
#
#   docker compose up -d --build                    # todo menos el túnel
#   docker compose --profile tunnel up -d --build   # + Cloudflare Tunnel
#
# Las variables se interpolan desde `.env` (copia `.env.example`). Todas tienen
# valor por defecto, así que el stack levanta sin `.env` en modo LLM "mock".
#
# Los nombres de host entre contenedores son los nombres de servicio:
# minecraft, mediamtx, orchestrator, camera, web, cloudflared.

name: phack2026

# Entorno común de las apps de Node (ver libs/env/src/index.ts).
x-node-env: &node-env
  NODE_ENV: production
  TZ: ${TZ:-America/Santiago}
  MC_HOST: minecraft
  MC_PORT: "25565"
  MC_VERSION: ${MC_VERSION:-1.20.4}
  RCON_HOST: minecraft
  RCON_PORT: "25575"
  RCON_PASSWORD: ${RCON_PASSWORD:-phack-rcon}
  ARENA_SCENARIO: ${ARENA_SCENARIO:-platanus}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-}
  VERCEL_API_KEY: ${VERCEL_API_KEY:-}
  ORCHESTRATOR_PORT: "8787"
  MATCH_DURATION_SECONDS: ${MATCH_DURATION_SECONDS:-180}
  MATCH_MAX_SECONDS: ${MATCH_MAX_SECONDS:-1800}
  AGENT_TICK_MS: ${AGENT_TICK_MS:-1500}
  AGENT_OBSERVATION_RADIUS: ${AGENT_OBSERVATION_RADIUS:-16}
  DATA_DIR: /data
  CAMERA_USERNAME: ${CAMERA_USERNAME:-Camara}
  CAMERA_WIDTH: ${CAMERA_WIDTH:-1280}
  CAMERA_HEIGHT: ${CAMERA_HEIGHT:-720}
  CAMERA_FPS: ${CAMERA_FPS:-30}
  RTMP_URL: rtmp://mediamtx:1935/live/arena

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  minecraft:
    # Java 21 corre Paper 1.20.4 sin problemas (requiere Java 17+).
    image: itzg/minecraft-server:java21
    restart: unless-stopped
    # El mapa de la pizza se importa SOLO si el escenario es pizza-spleef-2. La imagen
    # copia WORLD a /data/$LEVEL cuando esa carpeta no existe, y WORLD vacío no importa
    # nada: con un WORLD fijo, el primer arranque de "platanus" sería la pizza. Compose no
    # tiene condicionales, por eso se decide aquí antes de llamar al arranque de la imagen.
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ "$$LEVEL" = pizza-spleef-2 ]; then export WORLD=/worlds/pizza-spleef-2.zip; else unset WORLD; fi
        exec /start
    stop_grace_period: 60s
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-1.20.4}
      # Heap de la JVM. El límite del contenedor (mem_limit) deja margen para el resto de la JVM.
      MEMORY: ${MC_MEMORY:-2G}
      TZ: ${TZ:-America/Santiago}
      MOTD: "Prompt Arena - Platanus Hackathon 2026"
      # Los bots entran con nombre de usuario plano, sin cuenta de Mojang.
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:-phack-rcon}
      BROADCAST_RCON_TO_OPS: "false"
      # Un mundo por escenario (/data/platanus, /data/pizza-spleef-2): cambiar de escenario
      # no pisa el otro mundo. El ZIP de la pizza lo decide el entrypoint de arriba.
      LEVEL: ${ARENA_SCENARIO:-platanus}
      # Mundo vacío (void): solo aplica al CREAR un mundo nuevo (platanus). Un mundo importado
      # (la pizza) trae sus ajustes en su level.dat y los ignora.
      LEVEL_TYPE: FLAT
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:air","height":1}],"biome":"minecraft:the_void"}'
      GENERATE_STRUCTURES: "false"
      SPAWN_ANIMALS: "false"
      SPAWN_MONSTERS: "false"
      SPAWN_NPCS: "false"
      ALLOW_NETHER: "false"
      # NO usar "peaceful": regenera vida y congela el hambre, lo que arruina el duelo.
      # Con "normal" + SPAWN_MONSTERS=false no hay mobs y el PvP funciona normal.
      DIFFICULTY: normal
      PVP: "true"
      MODE: survival
      # 0 = cualquiera puede romper/poner bloques y pegar cerca del spawn.
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "10"
      # Evita expulsiones por "flying is not enabled" al teletransportar bots o con la cámara flotando.
      ALLOW_FLIGHT: "TRUE"
      ENABLE_COMMAND_BLOCK: "false"
      # Copia infra/minecraft/config/* directo a /data en cada arranque
      # (bukkit.yml con connection-throttle desactivado: ver ese archivo).
      COPY_CONFIG_DEST: /data
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      # Se ejecutan por RCON cuando el servidor termina de arrancar. El forceload cubre la
      # zona central de ambos escenarios; el orquestador agrega la del escenario activo.
      RCON_CMDS_STARTUP: |-
        gamerule doMobSpawning false
        gamerule doDaylightCycle false
        gamerule doWeatherCycle false
        time set noon
        weather clear
        forceload add -40 -32 47 63
    volumes:
      - minecraft-data:/data
      # ",z": etiqueta SELinux compartida (Fedora/RHEL con SELinux activo); sin efecto en otros hosts.
      - ./infra/minecraft/config:/config:ro,z
      - ./infra/minecraft/worlds:/worlds:ro,z
    ports:
      # Solo loopback del servidor: para entrar con un cliente real usa un túnel SSH
      # (ssh -L 25565:127.0.0.1:25565 usuario@servidor). RCON no se publica.
      - "127.0.0.1:25565:25565"
    mem_limit: 3g
    healthcheck:
      # `mc-health` viene incluido en la imagen de itzg.
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 10s
      retries: 12
      # El primer arranque descarga Paper y genera el mundo.
      start_period: 180s
    logging: *logging

  mediamtx:
    # Imagen "scratch": no tiene shell ni curl, por eso no lleva healthcheck.
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      # Montaje de UN archivo: si cambia en el host hay que reiniciar el contenedor
      # (docker compose restart mediamtx); scripts/deploy.sh ya lo hace.
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro,z
    # RTMP (1935) se publica SOLO en localhost: ahí publica el cliente real de Minecraft,
    # que corre en el host (infra/stream). HLS (8888) solo se usa dentro de la red de compose.
    ports:
      - "127.0.0.1:1935:1935"
    logging: *logging

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    restart: unless-stopped
    environment:
      <<: *node-env
      # Voz de los agentes (ElevenLabs). Solo el orquestador las necesita: la clave no llega
      # a la cámara. Sin clave o sin las dos voces, los mensajes solo se leen.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_RED: ${ELEVENLABS_VOICE_RED:-}
      ELEVENLABS_VOICE_BLUE: ${ELEVENLABS_VOICE_BLUE:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_SPEED: ${ELEVENLABS_SPEED:-1.1}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_64}
      ELEVENLABS_LANGUAGE: ${ELEVENLABS_LANGUAGE:-}
      VOICE_MAX_CHARS: ${VOICE_MAX_CHARS:-300}
      VOICE_MIN_CREDITS_LEFT: ${VOICE_MIN_CREDITS_LEFT:-5000}
    volumes:
      - orchestrator-data:/data
    depends_on:
      # "started" y no "healthy": el primer arranque de Minecraft puede tardar minutos y
      # no debe bloquear la web ni la API. El orquestador reintenta RCON hasta que responda.
      minecraft:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging: *logging

  camera:
    build:
      context: .
      dockerfile: apps/camera/Dockerfile
    restart: unless-stopped
    environment:
      <<: *node-env
      # Propias de la cámara (apps/camera/src/config.ts las lee directo de process.env).
      # client = el video lo dibuja el cliente real de Minecraft (infra/stream) y este
      # contenedor solo vuela al bot cámara. viewer = render propio (sin GPU).
      CAMERA_MODE: ${CAMERA_MODE:-client}
      STREAM_CLIENT_USERNAME: ${STREAM_CLIENT_USERNAME:-Camarografo}
      # Con pelea se alternan dos cámaras: la que sigue a los peleadores y la general.
      CAMERA_FOLLOW_SECONDS: ${CAMERA_FOLLOW_SECONDS:-20}
      CAMERA_WIDE_SECONDS: ${CAMERA_WIDE_SECONDS:-6}
      CAMERA_ORBIT_SECONDS: ${CAMERA_ORBIT_SECONDS:-0}
      CAMERA_VIEW_DISTANCE: ${CAMERA_VIEW_DISTANCE:-4}
      CAMERA_BITRATE_KBPS: ${CAMERA_BITRATE_KBPS:-2500}
      CAMERA_SILENT_AUDIO: ${CAMERA_SILENT_AUDIO:-}
    # Por si el render usa un navegador headless (Chromium necesita /dev/shm grande).
    shm_size: 512m
    depends_on:
      # "started": la cámara reintenta sola la conexión hasta que Minecraft esté listo.
      minecraft:
        condition: service_started
      mediamtx:
        condition: service_started
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vacío = mismo origen (/api y /live detrás de Caddy). Ver .env.example.
        PUBLIC_API_BASE: ${PUBLIC_API_BASE:-}
        PUBLIC_HLS_URL: ${PUBLIC_HLS_URL:-/live/arena/index.m3u8}
        # Calibración de la sincronía video/datos, en ms. Vacío = 400 (ver docs/handoff/medir-sincronia.md).
        PUBLIC_STREAM_PIPELINE_MS: ${PUBLIC_STREAM_PIPELINE_MS:-}
    restart: unless-stopped
    volumes:
      # El Caddyfile del repo manda aunque la imagen traiga uno propio:
      # así se puede ajustar el proxy sin reconstruir la web.
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      orchestrator:
        condition: service_started
      mediamtx:
        condition: service_started
    healthcheck:
      # Asume imagen final basada en caddy:alpine (trae wget de busybox).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started
    logging: *logging

volumes:
  minecraft-data:
  orchestrator-data:
